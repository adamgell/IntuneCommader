  /maester/status:
    get:
      operationId: getMaesterStatus
      summary: Probe Maester prerequisites (PowerShell 7 + Maester module)
      responses:
        "200":
          description: Prerequisite status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaesterStatus" }
  /maester/run:
    post:
      operationId: runMaester
      summary: >
        Start the Maester security-test suite against the signed-in tenant, sharing the
        active session token. Fire-and-forget: returns 202 immediately and runs in the
        background; poll GET /maester/run/status until it leaves Running, then GET
        /maester/results. Each run is categorized (Entra/Intune/…) and snapshotted into
        the append-only time-machine for posture drift.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaesterRunRequest" }
      responses:
        "202":
          description: Run started — poll /maester/run/status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaesterRunState" }
        "409": { description: Not signed in, or a run is already in progress }
        "501": { description: Maester / PowerShell prerequisites not available }
  /maester/run/status:
    get:
      operationId: getMaesterRunStatus
      summary: In-memory status of the current/last Maester run (cheap; poll while Running)
      responses:
        "200":
          description: Run state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaesterRunState" }
  /maester/results:
    get:
      operationId: getMaesterResults
      summary: Latest stored Maester run for the active tenant (from the time-machine)
